# Continuous integration: configure, build and run the test suite on every
# push and pull request. The Vulkan-dependent tests run under a virtual X
# server (xcb platform) backed by Mesa's software (lavapipe) Vulkan driver.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up native build environment
        uses: ./.github/actions/setup-native

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Install test runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            mesa-vulkan-drivers \
            libxcb1 libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-cursor0 libxkbcommon0 libxkbcommon-x11-0 libgssapi-krb5-2 \
            libfontconfig1 libfreetype6 libdbus-1-3 \
            vulkan-tools

      - name: Verify Vulkan device is available
        run: |
          set -euo pipefail
          xvfb-run -a vulkaninfo --summary

      - name: Test
        working-directory: build
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a ctest --output-on-failure --parallel "$(nproc)"
