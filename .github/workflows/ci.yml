# Continuous integration: configure, build and run the test suite on every
# push and pull request. Tests run headless on the Qt "offscreen" platform;
# Vulkan tests use Mesa's software (lavapipe) driver, which needs no display.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up native build environment
        uses: ./.github/actions/setup-native

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Install test runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers \
            libgl1 libegl1 libopengl0 \
            libfontconfig1 libfreetype6 \
            libxkbcommon0 libglib2.0-0t64 libdbus-1-3 libgssapi-krb5-2 \
            vulkan-tools

      - name: Verify Vulkan device is available
        run: vulkaninfo --summary

      - name: Test
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure --parallel "$(nproc)"
