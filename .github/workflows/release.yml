# Release pipeline: pushing a tag of the form vX.Y.Z builds a Flatpak bundle
# and an AppImage.
#
# The version is derived from the tag. Each build job writes a VERSION file so
# CMake resolves the exact release version (see CMakeLists.txt version logic).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pin version from tag
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Set up native build environment
        uses: ./.github/actions/setup-native

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"

      - name: Generate application icon
        run: rsvg-convert -w 512 -h 512 src/resources/icons/ottersnap.svg -o flatpak/io.github.lutravox.Ottersnap.png

      - name: Install AppImage bundling dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            binutils file \
            libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-render0 libxcb-render-util0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-shape0 libxcb-util1 libxcb-xkb1 libxcb-cursor0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libgtk-3-0 unixodbc libpq5 libmysqlclient21 libsqlite3-0

      - name: Download linuxdeployqt
        run: |
          curl -fsSL -o linuxdeployqt.AppImage \
            https://github.com/probonopd/linuxdeployqt/releases/latest/download/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt.AppImage

      - name: Prepare AppDir
        run: |
          set -euo pipefail
          appdir="Ottersnap.AppDir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/lib" "$appdir/usr/share/applications" \
                   "$appdir/usr/qml" "$appdir/usr/plugins/platforms"
          cp build/bin/ottersnap "$appdir/usr/bin/"
          cp flatpak/io.github.lutravox.Ottersnap.desktop "$appdir/usr/share/applications/"
          cp flatpak/io.github.lutravox.Ottersnap.png "$appdir/usr/share/applications/"
          # The app's QML is compiled into resources, so linuxdeployqt cannot
          # detect its module imports; bundle the module trees it loads.
          cp -r "${CMAKE_PREFIX_PATH}/qml/QtQuick" "$appdir/usr/qml/"
          cp -r "${CMAKE_PREFIX_PATH}/qml/QtQml"   "$appdir/usr/qml/"
          # Bundle the Wayland platform plugin plus all of its integration
          # plugins.
          cp -r "${CMAKE_PREFIX_PATH}/plugins/platforms/libqwayland-generic.so" "$appdir/usr/plugins/platforms/"
          cp -r "${CMAKE_PREFIX_PATH}/plugins/platforms/libqwayland-egl.so"      "$appdir/usr/plugins/platforms/"
          for d in wayland-shell-integration wayland-graphics-integration-client wayland-decoration-client; do
            if [ -d "${CMAKE_PREFIX_PATH}/plugins/$d" ]; then
              cp -r "${CMAKE_PREFIX_PATH}/plugins/$d" "$appdir/usr/plugins/"
            fi
          done
          for lib in libQt6WaylandClient libQt6WaylandEglClientHwIntegration libQt6WlShellIntegration libQt6OpenGL libQt6Svg; do
            for f in "${CMAKE_PREFIX_PATH}/lib/$lib".so.6*; do
              if [ -e "$f" ]; then cp "$f" "$appdir/usr/lib/"; fi
            done
          done
          for lib in libwayland-client.so.0 libwayland-cursor.so.0 libwayland-egl.so.1; do
            cp -L "/usr/lib/x86_64-linux-gnu/$lib" "$appdir/usr/lib/"
          done

      - name: Build AppImage
        run: |
          export PATH="${CMAKE_PREFIX_PATH}/bin:${PATH}"
          # The app uses the QSQLITE driver only; the mimer driver is bundled
          # by linuxdeployqt but its libmimerapi dependency is unavailable on
          # Ubuntu, which makes the deployment abort.
          rm -f "${CMAKE_PREFIX_PATH}/plugins/sqldrivers/libqsqlmimer.so"
          ./linuxdeployqt.AppImage --appimage-extract-and-run \
            Ottersnap.AppDir/usr/share/applications/io.github.lutravox.Ottersnap.desktop \
            -appimage -bundle-non-qt-libs -verbose=1

      - name: Name the AppImage after the release
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          artifact="$(ls *.AppImage | grep -v '^linuxdeployqt')"
          mv "$artifact" "Ottersnap-${ver}-linux-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ottersnap-AppImage
          path: Ottersnap-*-linux-x86_64.AppImage

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.9
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Pin version from tag
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Resolve manifest version placeholder
        run: |
          sed "s/{{VERSION}}/${GITHUB_REF_NAME#v}/g" \
            flatpak/io.github.lutravox.Ottersnap.json \
            > flatpak/io.github.lutravox.Ottersnap.resolved.json

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.lutravox.Ottersnap.resolved.json
          bundle: ottersnap.flatpak

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ottersnap-Flatpak
          path: ottersnap.flatpak

  release:
    needs: [appimage, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/Ottersnap-AppImage/*
            artifacts/Ottersnap-Flatpak/*
          generate_release_notes: true
